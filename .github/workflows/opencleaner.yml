name: OpenCleaner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the Rust engine on both platforms it ships on
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        working-directory: engine
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  macos:
    # Liquid Glass and swift-tools-version 6.2 need the macOS 26 SDK
    runs-on: macos-26
    env:
      # optional: base64 of a .p12 signing certificate and its password; without them the app is signed ad-hoc
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [[ "${GITHUB_REF_NAME#v}" == "$(cat VERSION)" ]] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      # the engine's Go helpers are built from the patched mo source (fetch-engine.sh)
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            macos/.build
            macos/build/engine-*
            macos/build/mo-engine-*-source.tar.gz
          key: spm-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'legacy/mo/**') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Import the signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # a password pasted into the secret often ends with a newline
          PASS=$(printf %s "$MACOS_CERT_PASSWORD" | tr -d '\r\n ')
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_ID=$MACOS_SIGN_ID" >> "$GITHUB_ENV"

      - name: Build the engine library (universal)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          engine/build-lib.sh --universal

      - run: swift test --package-path macos
      - name: Test the patched engine
        run: ENGINE_TEST=1 legacy/mo/fetch-engine.sh --rebuild
      - run: macos/build.sh --universal

      - name: Check the bundle
        run: |
          APP=macos/build/OpenCleaner.app
          lipo -info $APP/Contents/MacOS/OpenCleaner
          codesign --verify --deep --strict $APP
          $APP/Contents/Resources/engine/mole --version

      - name: Package the app and the engine source
        run: |
          ditto -c -k --keepParent macos/build/OpenCleaner.app OpenCleaner-macos.zip
          # GPL-3.0: the exact (patched) source of the bundled mo engine
          cp "$(legacy/mo/fetch-engine.sh --source | tail -1)" .

      - uses: actions/upload-artifact@v7
        with:
          name: OpenCleaner-macos
          path: |
            OpenCleaner-macos.zip
            mo-engine-*-source.tar.gz

  # Push a tag like v0.1.0 (matching VERSION) to publish a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # dist/ holds the app zip and the patched engine source (GPL-3.0), both built by the macos job
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "OpenCleaner $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
