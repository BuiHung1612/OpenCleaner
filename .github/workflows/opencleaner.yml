name: OpenCleaner

on:
  # main and release tags only: other branches are built through their pull request
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# a newer push to the same branch or PR replaces the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # the Rust engine on both platforms it ships on
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        working-directory: engine
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --no-fail-fast
      # speed vs du on a 200k-file tree. Warning only until the baseline is measured on
      # CI runners (engine/bench/baseline.json was set on a busy laptop)
      - name: Benchmark
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: engine
        run: |
          cargo build --release --bin oce
          python3 bench/bench.py target/release/oce "$RUNNER_TEMP/oc-bench"

  # the Windows app: native UI (Win32 + GDI+) on the same engine
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            windows/target
          key: win-app-${{ hashFiles('engine/Cargo.lock', 'windows/Cargo.lock') }}
          restore-keys: win-app-
      - name: Build
        working-directory: windows
        run: |
          cargo clippy --release -- -D warnings
          cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $exe = "windows/target/release/OpenCleaner.exe"
          if (-not (Test-Path $exe)) { throw "OpenCleaner.exe was not built" }
          Get-Item $exe | Format-List Name, Length
          Compress-Archive -Path $exe -DestinationPath OpenCleaner-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: OpenCleaner-windows
          path: OpenCleaner-windows.zip

  macos:
    # Liquid Glass and swift-tools-version 6.2 need the macOS 26 SDK
    runs-on: macos-26
    env:
      # optional: base64 of a .p12 signing certificate and its password; without them the app is signed ad-hoc
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version

      - name: Missing Vietnamese strings (warning only)
        run: swift macos/check-strings.swift vi || true

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [[ "${GITHUB_REF_NAME#v}" == "$(cat VERSION)" ]] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - uses: actions/cache@v6
        with:
          path: |
            macos/.build
            ~/.cargo/registry
            engine/target
          key: spm-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'engine/Cargo.lock') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Import the signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # a password pasted into the secret often ends with a newline
          PASS=$(printf %s "$MACOS_CERT_PASSWORD" | tr -d '\r\n ')
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_ID=$MACOS_SIGN_ID" >> "$GITHUB_ENV"

      - name: Build the engine library (universal)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          engine/build-lib.sh --universal

      - run: swift test --package-path macos
      - run: macos/build.sh --universal

      - name: Check the bundle
        run: |
          APP=macos/build/OpenCleaner.app
          lipo -info $APP/Contents/MacOS/OpenCleaner
          codesign --verify --deep --strict $APP
          test -f $APP/Contents/Resources/tools.json

      - run: ditto -c -k --keepParent macos/build/OpenCleaner.app OpenCleaner-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: OpenCleaner-macos
          path: OpenCleaner-macos.zip

  # Push a tag like v0.1.0 (matching VERSION) to publish a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Homebrew cask and winget manifests for this release, attached as assets (submitted by hand: packaging/README.md)
      - name: Render package manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          render() { sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$2/g" "$1" > "dist/$(basename "$1")"; }
          MAC=$(sha256sum dist/OpenCleaner-macos.zip | cut -d' ' -f1)
          WIN=$(sha256sum dist/OpenCleaner-windows.zip | cut -d' ' -f1)
          render packaging/homebrew/opencleaner.rb "$MAC"
          for f in packaging/winget/*.yaml; do render "$f" "${WIN^^}"; done
          ! grep -l '{{' dist/opencleaner.rb dist/*.yaml # every placeholder filled
      # dist/ holds the app zips built by the macos and windows-app jobs, and the manifests
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "OpenCleaner $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
