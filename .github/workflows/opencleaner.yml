name: OpenCleaner

on:
  # main and release tags only: other branches are built through their pull request
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# a newer push to the same branch or PR replaces the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # the Rust engine on both platforms it ships on
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        working-directory: engine
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --no-fail-fast
      # speed vs du on a 200k-file tree; fails past 2x engine/bench/baseline.json. The
      # baseline is the median of 14 macOS runner results (Nov 2026: size 0.35-0.83,
      # space 0.43-0.92); space_repeat (0.02-0.09, ~50 ms, mostly process start) is held
      # at 0.1 so noise cannot fail it while a cache that stops working (~0.6) still does
      - name: Benchmark
        if: runner.os == 'macOS'
        working-directory: engine
        run: |
          cargo build --release --bin oce
          python3 bench/bench.py target/release/oce "$RUNNER_TEMP/oc-bench"

  # the Windows app: native UI (Win32 + GDI+) on the same engine
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            windows/target
          key: win-app-${{ hashFiles('engine/Cargo.lock', 'windows/Cargo.lock') }}
          restore-keys: win-app-
      - name: Build
        working-directory: windows
        run: |
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release
          cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $exe = "windows/target/release/OpenCleaner.exe"
          if (-not (Test-Path $exe)) { throw "OpenCleaner.exe was not built" }
          Get-Item $exe | Format-List Name, Length
      # the app on a real Windows desktop: it must start, stay up and show its window; then
      # each page through the keyboard (Tab along the sidebar, Enter), with a screenshot each
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class W {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
              public static string Title(IntPtr h) { var s = new StringBuilder(256); GetWindowText(h, s, 256); return s.ToString(); }
          }
          '@
          $shots = Join-Path $env:RUNNER_TEMP 'screenshots'
          New-Item -ItemType Directory -Force $shots | Out-Null
          $crash = Join-Path $env:LOCALAPPDATA 'OpenCleaner\crash.log'
          Remove-Item $crash -ErrorAction SilentlyContinue
          function Shot($name) {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save((Join-Path $shots "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
          }
          function Alive($p, $when) {
              if ($p.HasExited) {
                  if (Test-Path $crash) { Get-Content $crash | Write-Host }
                  throw "OpenCleaner exited $when (exit code $($p.ExitCode))"
              }
          }
          # PostMessage, not SendKeys: works whether or not the window has the focus
          function Key($hwnd, $vk) {
              [void][W]::PostMessage($hwnd, 0x0100, [IntPtr]$vk, [IntPtr]::Zero)  # WM_KEYDOWN
              Start-Sleep -Milliseconds 300
          }

          $p = Start-Process -FilePath windows/target/release/OpenCleaner.exe -PassThru
          Start-Sleep -Seconds 8
          Alive $p 'within 8 seconds of starting'
          # the process's own main window (FindWindow with a $null title gets "" from PowerShell
          # and matches nothing)
          $hwnd = [IntPtr]::Zero
          foreach ($i in 1..10) {
              $p.Refresh()
              $hwnd = $p.MainWindowHandle
              if ($hwnd -ne [IntPtr]::Zero) { break }
              Start-Sleep -Seconds 1
          }
          if ($hwnd -eq [IntPtr]::Zero -or -not [W]::IsWindowVisible($hwnd)) { Shot '00-no-window'; throw 'OpenCleaner shows no window' }
          Write-Host "Main window $($p.MainWindowHandle): '$([W]::Title($hwnd))'"
          [void][W]::SetForegroundWindow($hwnd)
          Start-Sleep -Seconds 1
          Shot '01-dashboard'

          # sidebar order after the dashboard (pages.rs SECTIONS); the first Tab focuses Dashboard
          $pages = 'System Junk', 'Installers', 'Project Junk', 'Developer Tools', 'Uninstaller', 'Startup Items', 'Space Lens', 'Large & Old Files', 'Duplicates', 'History', 'Settings'
          Key $hwnd 0x09
          $n = 2
          foreach ($page in $pages) {
              Key $hwnd 0x09   # Tab: next sidebar entry
              Key $hwnd 0x0D   # Enter: open it
              Start-Sleep -Seconds 2
              Alive $p "on $page"
              $title = [W]::Title($hwnd)
              Write-Host "Page: '$title'"
              if ($title -ne "OpenCleaner - $page") { Write-Host "::warning::expected page '$page', the window says '$title'" }
              $file = '{0:d2}-{1}' -f $n, ($page -replace '[^A-Za-z]+', '-').ToLower()
              Shot $file
              $n++
              if ($page -eq 'System Junk') {
                  Key $hwnd 0x74   # F5: scan (nothing is removed without a click and a confirmation)
                  Start-Sleep -Seconds 20
                  Alive $p 'while scanning System Junk'
                  Shot ('{0:d2}-system-junk-scanned' -f $n)
                  $n++
              }
          }
          Alive $p 'at the end'
          Stop-Process -Id $p.Id

          # the same app in Vietnamese (Settings > General > Language), a few pages
          New-Item -Path 'HKCU:\Software\OpenCleaner' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\OpenCleaner' -Name 'Language' -Value 2 -Type DWord
          $p = Start-Process -FilePath windows/target/release/OpenCleaner.exe -PassThru
          Start-Sleep -Seconds 8
          Alive $p 'in Vietnamese'
          $p.Refresh(); $hwnd = $p.MainWindowHandle
          [void][W]::SetForegroundWindow($hwnd)
          Shot 'vi-01-dashboard'
          Key $hwnd 0x09
          Key $hwnd 0x09; Key $hwnd 0x0D; Start-Sleep -Seconds 2; Shot 'vi-02-system-junk'
          foreach ($i in 1..10) { Key $hwnd 0x09 }   # System Junk to Settings in the sidebar
          Key $hwnd 0x0D; Start-Sleep -Seconds 2; Shot 'vi-03-settings'
          Alive $p 'at the end in Vietnamese'
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: OpenCleaner-windows-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
      # shipped as the bare exe: one file, nothing to unpack
      - uses: actions/upload-artifact@v7
        with:
          name: OpenCleaner-windows
          path: windows/target/release/OpenCleaner.exe
      # the Microsoft Store package: the same exe, unsigned (the Store signs it)
      - name: Pack the Microsoft Store package
        shell: pwsh
        run: |
          $version = "$((Get-Content VERSION -Raw).Trim()).0"
          $dir = Join-Path $env:RUNNER_TEMP msix
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item packaging/msix/Assets $dir -Recurse
          Copy-Item windows/target/release/OpenCleaner.exe $dir
          (Get-Content packaging/msix/AppxManifest.xml -Raw).Replace('{{VERSION}}', $version) | Set-Content (Join-Path $dir AppxManifest.xml) -Encoding utf8
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          & $makeappx.FullName pack /o /d $dir /p OpenCleaner.msix
          if ($LASTEXITCODE) { throw "makeappx failed" }
      - uses: actions/upload-artifact@v7
        with:
          name: OpenCleaner-msix
          path: OpenCleaner.msix

  macos:
    # Liquid Glass and swift-tools-version 6.2 need the macOS 26 SDK
    runs-on: macos-26
    env:
      # optional: base64 of a .p12 signing certificate and its password; without them the app is signed ad-hoc
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest installed Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version

      - name: Missing Vietnamese strings (warning only)
        run: swift macos/check-strings.swift vi || true

      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [[ "${GITHUB_REF_NAME#v}" == "$(cat VERSION)" ]] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - uses: actions/cache@v6
        with:
          path: |
            macos/.build
            ~/.cargo/registry
            engine/target
          key: spm-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'engine/Cargo.lock') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Import the signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # a password pasted into the secret often ends with a newline
          PASS=$(printf %s "$MACOS_CERT_PASSWORD" | tr -d '\r\n ')
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_ID=$MACOS_SIGN_ID" >> "$GITHUB_ENV"

      - name: Build the engine library (universal)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          engine/build-lib.sh --universal

      - run: swift test --package-path macos
      - run: macos/build.sh --universal

      - name: Check the bundle
        run: |
          APP=macos/build/OpenCleaner.app
          lipo -info $APP/Contents/MacOS/OpenCleaner
          codesign --verify --deep --strict $APP
          test -f $APP/Contents/Resources/tools.json

      # a disk image: the app next to an Applications shortcut, dragged across once
      - name: Disk image
        run: |
          mkdir dmg
          cp -R macos/build/OpenCleaner.app dmg/
          ln -s /Applications dmg/Applications
          # the image stays unsigned: Gatekeeper refuses to open a disk image signed by a
          # certificate Apple did not issue, but mounts an unsigned one (the app inside is signed)
          hdiutil create -volname OpenCleaner -srcfolder dmg -ov -format ULFO OpenCleaner.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: OpenCleaner-macos
          path: OpenCleaner.dmg

  # Push a tag like v0.1.0 (matching VERSION) to publish a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # only the two apps (the smoke-test screenshots are another artifact)
      - uses: actions/download-artifact@v8
        with:
          name: OpenCleaner-macos
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: OpenCleaner-windows
          path: dist
      # for the first Store submission by hand (unsigned: it installs only through the Store)
      - uses: actions/download-artifact@v8
        with:
          name: OpenCleaner-msix
          path: dist
      # Homebrew cask and winget manifests for this release, attached as assets (submitted by hand: packaging/README.md)
      - name: Render package manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          render() { sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$2/g" "$1" > "dist/$(basename "$1")"; }
          MAC=$(sha256sum dist/OpenCleaner.dmg | cut -d' ' -f1)
          WIN=$(sha256sum dist/OpenCleaner.exe | cut -d' ' -f1)
          render packaging/homebrew/opencleaner.rb "$MAC"
          for f in packaging/winget/*.yaml; do render "$f" "${WIN^^}"; done
          # every placeholder of ours filled ({{appdir}} in the cask is Homebrew's own token)
          ! grep -lE '\{\{(VERSION|SHA256)\}\}' dist/opencleaner.rb dist/*.yaml
      # dist/ holds OpenCleaner.dmg, OpenCleaner.exe and OpenCleaner.msix from the macos and windows-app jobs, and the manifests
      # notes: this version's section of CHANGELOG.md, then GitHub's changelog link
      - run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "OpenCleaner $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # After the GitHub Release: the same version to the Microsoft Store, when the Partner Center
  # credentials are set (packaging/README.md). The Store certifies it before it goes out.
  store:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: windows-latest
    env:
      # only whether they are set; the secrets themselves go to the submit step alone
      HAS_STORE: ${{ secrets.MSSTORE_CLIENT_ID != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenCleaner-msix
      - uses: microsoft/setup-msstore-cli@v1
        if: env.HAS_STORE == 'true'
      - name: Submit to the Microsoft Store
        if: env.HAS_STORE == 'true'
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          msstore publish . -i OpenCleaner.msix -id 9PCVNWSXKCCZ
          if ($LASTEXITCODE) { throw "msstore publish failed" }
