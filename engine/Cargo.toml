[package]
name = "oc_engine"
version = "0.3.5"
license = "MIT"
edition = "2024"
description = "OpenCleaner engine: disk scanning, sizing and cleaning for macOS and Windows"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "oce"
path = "src/bin/oce.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = { version = "1", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_ProcessStatus"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
