# OpenCleaner cleaning rules for Windows. Schema: src/rules.rs. Paths use %VAR% (LOCALAPPDATA,
# APPDATA, TEMP, USERPROFILE) and stay inside the user's profile.

[[group]]
id = "browsers"
title = "Browsers"

[[group]]
id = "developer"
title = "Developer tools"

[[group]]
id = "system"
title = "Temporary files & logs"

[[group]]
id = "privacy"
title = "Privacy"

[[rule]]
id = "browser.chrome"
group = "browsers"
title = "Google Chrome"
paths = [
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Cache",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Code Cache",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/GPUCache",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Service Worker/CacheStorage",
]
target = "self"
running = ["chrome.exe"]
note = "Web page cache. Logins and history stay."

[[rule]]
id = "browser.edge"
group = "browsers"
title = "Microsoft Edge"
paths = [
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/Cache",
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/Code Cache",
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/GPUCache",
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/Service Worker/CacheStorage",
]
target = "self"
running = ["msedge.exe"]
note = "Web page cache. Logins and history stay."

[[rule]]
id = "browser.firefox"
group = "browsers"
title = "Firefox"
paths = ["%LOCALAPPDATA%/Mozilla/Firefox/Profiles/*/cache2"]
target = "self"
running = ["firefox.exe"]
note = "Web page cache. Logins and history stay."

[[rule]]
id = "app.vscode"
group = "developer"
title = "Visual Studio Code"
paths = [
  "%APPDATA%/Code/Cache",
  "%APPDATA%/Code/CachedData",
  "%APPDATA%/Code/Code Cache",
  "%APPDATA%/Code/GPUCache",
  "%APPDATA%/Code/CachedExtensionVSIXs",
  "%APPDATA%/Code - Insiders/Cache",
  "%APPDATA%/Code - Insiders/CachedData",
  "%APPDATA%/Code - Insiders/Code Cache",
  "%APPDATA%/Code - Insiders/GPUCache",
  "%APPDATA%/Code - Insiders/CachedExtensionVSIXs",
]
running = ["Code.exe", "Code - Insiders.exe"]
note = "Editor code cache and downloaded extension packages. Settings and extensions stay."

