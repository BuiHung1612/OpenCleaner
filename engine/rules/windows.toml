[[rule]]
id = "dev.npm"
group = "developer"
title = "npm cache"
paths = ["%LOCALAPPDATA%/npm-cache/_cacache"]
target = "self"
note = "Downloaded packages; npm downloads them again when needed."

[[rule]]
id = "dev.gradle"
group = "developer"
title = "Gradle caches"
paths = ["%USERPROFILE%/.gradle/caches"]
target = "self"
default = false
note = "Downloaded dependencies and build caches. The next build downloads and rebuilds them."

[[rule]]
id = "dev.pip"
group = "developer"
title = "pip cache"
paths = ["%LOCALAPPDATA%/pip/cache"]
target = "self"
note = "Downloaded Python packages; pip fetches them again."

[[rule]]
id = "dev.yarn"
group = "developer"
title = "Yarn cache"
paths = ["%LOCALAPPDATA%/Yarn/Cache"]
target = "self"
note = "Downloaded packages; yarn fetches them again."

[[rule]]
id = "dev.cargo"
group = "developer"
title = "Cargo downloads"
paths = ["%USERPROFILE%/.cargo/registry/cache", "%USERPROFILE%/.cargo/registry/src"]
target = "self"
default = false
note = "Downloaded crate archives and sources; cargo fetches them again."

[[rule]]
id = "dev.nuget"
group = "developer"
title = "NuGet packages"
paths = ["%USERPROFILE%/.nuget/packages"]
target = "self"
default = false
note = "Downloaded .NET packages. The next restore downloads them again."

[[rule]]
id = "system.shadercache"
group = "system"
title = "Graphics shader caches"
paths = [
  "%LOCALAPPDATA%/D3DSCache",
  "%LOCALAPPDATA%/NVIDIA/DXCache",
  "%LOCALAPPDATA%/NVIDIA/GLCache",
  "%LOCALAPPDATA%/AMD/DxCache",
]
note = "Compiled shaders. Games rebuild them; the first launch after cleaning may stutter."

[[rule]]
id = "system.temp"
group = "system"
title = "Temporary files"
paths = ["%TEMP%"]
min_age_days = 1
note = "Files programs left in the temp folder, older than a day. Files in use are skipped."

[[rule]]
id = "system.inetcache"
group = "system"
title = "Internet cache"
paths = ["%LOCALAPPDATA%/Microsoft/Windows/INetCache"]
note = "Cache of Windows web components."

[[rule]]
id = "system.crashdumps"
group = "system"
title = "Crash dumps and error reports"
paths = [
  "%LOCALAPPDATA%/CrashDumps",
  "%LOCALAPPDATA%/Microsoft/Windows/WER/ReportArchive",
  "%LOCALAPPDATA%/Microsoft/Windows/WER/ReportQueue",
]
note = "Memory dumps and reports of programs that crashed."

[[rule]]
id = "system.thumbnails"
group = "system"
title = "Thumbnail cache"
paths = ["%LOCALAPPDATA%/Microsoft/Windows/Explorer"]
include = ["thumbcache_*.db", "iconcache_*.db"]
default = false
note = "Explorer rebuilds thumbnails as you browse folders. Files Explorer has open are skipped."

# --- privacy --------------------------------------------------------------------------
# History and cookies, one choice each, never preselected; skipped while the browser runs.

[[rule]]
id = "privacy.chrome.history"
group = "privacy"
title = "Chrome history"
paths = [
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/History",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/History-journal",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/History-wal",
]
target = "self"
running = ["chrome.exe"]
default = false
note = "Sites you visited and your download list. Bookmarks, passwords and open tabs stay."

[[rule]]
id = "privacy.chrome.cookies"
group = "privacy"
title = "Chrome cookies"
paths = [
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Cookies",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Cookies-journal",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Network/Cookies",
  "%LOCALAPPDATA%/Google/Chrome/User Data/*/Network/Cookies-journal",
]
target = "self"
running = ["chrome.exe"]
default = false
note = "Signs you out of every website and forgets site preferences kept in cookies. Saved passwords stay."

[[rule]]
id = "privacy.edge.history"
group = "privacy"
title = "Edge history"
paths = [
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/History",
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/History-journal",
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/History-wal",
]
target = "self"
running = ["msedge.exe"]
default = false
note = "Sites you visited and your download list. Bookmarks, passwords and open tabs stay."

[[rule]]
id = "privacy.edge.cookies"
group = "privacy"
title = "Edge cookies"
paths = [
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/Cookies",
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/Cookies-journal",
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/Network/Cookies",
  "%LOCALAPPDATA%/Microsoft/Edge/User Data/*/Network/Cookies-journal",
]
target = "self"
running = ["msedge.exe"]
default = false
note = "Signs you out of every website and forgets site preferences kept in cookies. Saved passwords stay."

[[rule]]
id = "privacy.firefox.history"
group = "privacy"
title = "Firefox history"
paths = [
  "%APPDATA%/Mozilla/Firefox/Profiles/*/places.sqlite",
  "%APPDATA%/Mozilla/Firefox/Profiles/*/places.sqlite-wal",
  "%APPDATA%/Mozilla/Firefox/Profiles/*/places.sqlite-shm",
]
target = "self"
running = ["firefox.exe"]
default = false
note = "Sites you visited. Firefox restores your bookmarks from its latest automatic backup; bookmarks changed since that backup may be lost."

[[rule]]
id = "privacy.firefox.cookies"
group = "privacy"
title = "Firefox cookies"
paths = [
  "%APPDATA%/Mozilla/Firefox/Profiles/*/cookies.sqlite",
  "%APPDATA%/Mozilla/Firefox/Profiles/*/cookies.sqlite-wal",
  "%APPDATA%/Mozilla/Firefox/Profiles/*/cookies.sqlite-shm",
]
target = "self"
running = ["firefox.exe"]
default = false
note = "Signs you out of every website and forgets site preferences kept in cookies. Saved passwords stay."
