# OpenCleaner cleaning rules for macOS. Schema: src/rules.rs.
# Order matters: an earlier rule claims a path first, so specific rules come before the
# general "User caches" one. Everything here lives in the user's home and is rebuilt by the
# app that made it; `default = false` marks what is worth a look before cleaning.

[[group]]
id = "browsers"
title = "Browsers"

[[group]]
id = "apps"
title = "App caches"

[[group]]
id = "developer"
title = "Developer tools"

[[group]]
id = "system"
title = "User caches & logs"

[[group]]
id = "privacy"
title = "Privacy"

[[group]]
id = "trash"
title = "Trash"

# --- browsers -------------------------------------------------------------------------

[[rule]]
id = "browser.chrome"
group = "browsers"
title = "Google Chrome"
paths = [
  "~/Library/Caches/Google/Chrome",
  "~/Library/Application Support/Google/Chrome/*/Service Worker/CacheStorage",
  "~/Library/Application Support/Google/Chrome/*/GPUCache",
  "~/Library/Application Support/Google/Chrome/GrShaderCache",
  "~/Library/Application Support/Google/Chrome/ShaderCache",
]
running = ["com.google.Chrome"]
note = "Web page cache and offline site data caches. Logins and history stay."

[[rule]]
id = "browser.edge"
group = "browsers"
title = "Microsoft Edge"
paths = [
  "~/Library/Caches/Microsoft Edge",
  "~/Library/Application Support/Microsoft Edge/*/Service Worker/CacheStorage",
  "~/Library/Application Support/Microsoft Edge/*/GPUCache",
]
running = ["com.microsoft.edgemac"]
note = "Web page cache. Logins and history stay."

[[rule]]
id = "browser.brave"
group = "browsers"
title = "Brave"
paths = [
  "~/Library/Caches/BraveSoftware/Brave-Browser",
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/Service Worker/CacheStorage",
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/GPUCache",
]
running = ["com.brave.Browser"]
note = "Web page cache. Logins and history stay."

[[rule]]
id = "browser.arc"
group = "browsers"
title = "Arc"
paths = ["~/Library/Caches/Arc"]
running = ["company.thebrowser.Browser"]
note = "Web page cache. Logins and history stay."

[[rule]]
id = "browser.firefox"
group = "browsers"
title = "Firefox"
paths = ["~/Library/Caches/Firefox/Profiles/*/cache2", "~/Library/Caches/Firefox/Profiles/*/startupCache"]
target = "self"
running = ["org.mozilla.firefox"]
note = "Web page cache. Logins and history stay."

# --- app caches -----------------------------------------------------------------------

[[rule]]
id = "app.slack"
group = "apps"
title = "Slack"
paths = [
  "~/Library/Application Support/Slack/Cache",
  "~/Library/Application Support/Slack/Code Cache",
  "~/Library/Application Support/Slack/GPUCache",
  "~/Library/Application Support/Slack/Service Worker/CacheStorage",
  "~/Library/Containers/com.tinyspeck.slackmacgap/Data/Library/Application Support/Slack/Cache",
]
running = ["com.tinyspeck.slackmacgap"]
note = "Downloaded images and app code cache. Messages stay on Slack's servers."

[[rule]]
id = "app.discord"
group = "apps"
title = "Discord"
paths = [
  "~/Library/Application Support/discord/Cache",
  "~/Library/Application Support/discord/Code Cache",
  "~/Library/Application Support/discord/GPUCache",
]
running = ["com.hnc.Discord"]
note = "Downloaded media and app code cache."

[[rule]]
id = "app.vscode"
group = "apps"
title = "Visual Studio Code"
paths = [
  "~/Library/Application Support/Code/Cache",
  "~/Library/Application Support/Code/CachedData",
  "~/Library/Application Support/Code/Code Cache",
  "~/Library/Application Support/Code/GPUCache",
  "~/Library/Application Support/Code/CachedExtensionVSIXs",
]
running = ["com.microsoft.VSCode"]
note = "Editor code cache and downloaded extension packages. Settings and extensions stay."

[[rule]]
id = "app.code-forks"
group = "apps"
title = "Cursor, Windsurf and other VS Code editors"
paths = [
  "~/Library/Application Support/Cursor/Cache",
  "~/Library/Application Support/Cursor/CachedData",
  "~/Library/Application Support/Cursor/Code Cache",
  "~/Library/Application Support/Cursor/GPUCache",
  "~/Library/Application Support/Windsurf/Cache",
  "~/Library/Application Support/Windsurf/CachedData",
  "~/Library/Application Support/Windsurf/Code Cache",
  "~/Library/Application Support/Windsurf/GPUCache",
  "~/Library/Application Support/Antigravity/Cache",
  "~/Library/Application Support/Antigravity/CachedData",
  "~/Library/Application Support/Antigravity/Code Cache",
  "~/Library/Application Support/Antigravity IDE/Cache",
  "~/Library/Application Support/Antigravity IDE/CachedData",
  "~/Library/Application Support/Antigravity IDE/Code Cache",
]
running = ["com.todesktop.230313mzl4w4u92", "com.exafunction.windsurf", "com.google.antigravity", "com.google.antigravity-ide"]
note = "Editor code caches. Settings and extensions stay."

[[rule]]
id = "app.google"
group = "apps"
title = "Android Studio and other Google apps"
paths = ["~/Library/Caches/Google"]
exclude = ["Chrome"]
running = ["com.google.android.studio"]
note = "Caches of Google apps other than Chrome (Chrome has its own row)."

[[rule]]
id = "app.teams"
group = "apps"
title = "Microsoft Teams"
paths = ["~/Library/Containers/com.microsoft.teams2/Data/Library/Caches"]
running = ["com.microsoft.teams2"]
note = "Downloaded images and web cache."

# --- developer tools ------------------------------------------------------------------

[[rule]]
id = "dev.xcode.derived"
group = "developer"
title = "Xcode build data (DerivedData)"
paths = ["~/Library/Developer/Xcode/DerivedData"]
running = ["com.apple.dt.Xcode"]
note = "Build products and indexes. Xcode rebuilds them; the next build of each project takes longer."

[[rule]]
id = "dev.xcode.cache"
group = "developer"
title = "Xcode cache"
paths = ["~/Library/Caches/com.apple.dt.Xcode"]
target = "self"
running = ["com.apple.dt.Xcode"]
note = "Downloaded documentation and other caches Xcode fetches again."

[[rule]]
id = "dev.simulator.caches"
group = "developer"
title = "Simulator caches"
paths = ["~/Library/Developer/CoreSimulator/Caches"]
running = ["com.apple.iphonesimulator"]
note = "Rebuilt when a simulator boots. Simulators and their apps stay."

[[rule]]
id = "dev.xcode.devicesupport"
group = "developer"
title = "Device support files"
paths = ["~/Library/Developer/Xcode/iOS DeviceSupport", "~/Library/Developer/Xcode/watchOS DeviceSupport"]
default = false
note = "Debug symbols copied from devices you connected. Copied again (slowly) the next time that device connects."

[[rule]]
id = "dev.npm"
group = "developer"
title = "npm cache"
paths = ["~/.npm/_cacache"]
target = "self"
note = "Downloaded packages; npm downloads them again when needed."

[[rule]]
id = "dev.gradle"
group = "developer"
title = "Gradle caches"
paths = ["~/.gradle/caches"]
target = "self"
default = false
note = "Downloaded dependencies and build caches. The next build downloads and rebuilds them."

[[rule]]
id = "dev.pnpm"
group = "developer"
title = "pnpm store"
paths = ["~/Library/pnpm/store"]
target = "self"
default = false
note = "Shared package store. Projects keep working; installs download packages again."

[[rule]]
id = "dev.cargo"
group = "developer"
title = "Cargo downloads"
paths = ["~/.cargo/registry/cache", "~/.cargo/registry/src"]
target = "self"
default = false
note = "Downloaded crate archives and sources; cargo fetches them again."

[[rule]]
id = "dev.xdg"
group = "developer"
title = "Tool caches (~/.cache)"
paths = ["~/.cache"]
exclude = ["huggingface", "torch", "lm-studio", "ollama", "whisper", "pre-commit"]
default = false
note = "Caches of command-line tools. Model downloads (Hugging Face, PyTorch…) are not included."

[[rule]]
id = "dev.xcode.archives"
group = "developer"
title = "Old Xcode archives"
paths = ["~/Library/Developer/Xcode/Archives"]
min_age_days = 90
default = false
note = "App builds you archived more than 90 days ago. Keep the ones whose crash logs you still need to read."

[[rule]]
id = "dev.cocoapods"
group = "developer"
title = "CocoaPods cache"
paths = ["~/Library/Caches/CocoaPods"]
target = "self"
note = "Downloaded pods; pod install fetches them again."

[[rule]]
id = "dev.yarn"
group = "developer"
title = "Yarn cache"
paths = ["~/Library/Caches/Yarn"]
target = "self"
note = "Downloaded packages; yarn fetches them again."

[[rule]]
id = "dev.pip"
group = "developer"
title = "pip cache"
paths = ["~/Library/Caches/pip"]
target = "self"
note = "Downloaded Python packages; pip fetches them again."

[[rule]]
id = "dev.homebrew"
group = "developer"
title = "Homebrew downloads"
paths = ["~/Library/Caches/Homebrew"]
target = "self"
note = "Downloaded bottles and source archives. Installed packages stay."

[[rule]]
id = "dev.go"
group = "developer"
title = "Go build cache"
paths = ["~/Library/Caches/go-build"]
target = "self"
note = "Compiled packages; the next go build compiles them again."

[[rule]]
id = "dev.maven"
group = "developer"
title = "Maven repository"
paths = ["~/.m2/repository"]
target = "self"
default = false
note = "Downloaded Java dependencies. The next build downloads them again."

[[rule]]
id = "dev.android"
group = "developer"
title = "Android SDK cache"
paths = ["~/.android/cache"]
target = "self"
note = "Downloaded SDK metadata; Android Studio fetches it again."

[[rule]]
id = "dev.pub"
group = "developer"
title = "Flutter / Dart packages"
paths = ["~/.pub-cache/hosted"]
default = false
note = "Downloaded Dart packages. Run flutter pub get in a project to fetch them again."

# --- Apple devices & Mail -------------------------------------------------------------

[[rule]]
id = "system.ios.updates"
group = "system"
title = "iPhone and iPad software updates"
paths = ["~/Library/iTunes/iPhone Software Updates", "~/Library/iTunes/iPad Software Updates"]
note = "System updates Finder downloaded for your devices. Downloaded again when needed."

[[rule]]
id = "system.ios.backups"
group = "system"
title = "iPhone and iPad backups"
paths = ["~/Library/Application Support/MobileSync/Backup"]
default = false
note = "Local device backups. Remove only backups you no longer need (open a row to see each one); this cannot be undone."

[[rule]]
id = "system.mail.downloads"
group = "system"
title = "Mail attachments you opened"
paths = ["~/Library/Containers/com.apple.mail/Data/Library/Mail Downloads"]
running = ["com.apple.mail"]
note = "Copies Mail made when you opened attachments. The attachments stay in your mail."

# --- user caches & logs (general, after the specific rules above) ---------------------

[[rule]]
id = "user.caches"
group = "system"
title = "App caches in Library"
paths = ["~/Library/Caches"]
item_is_bundle_id = true
exclude = [
  "com.apple.*",
  "CloudKit",
  "FamilyCircle",
  "Google",
  "Firefox",
  "Microsoft Edge",
  "BraveSoftware",
  "Arc",
]
note = "Files apps keep to start faster. Each app rebuilds its own; caches of running apps are left alone."

[[rule]]
id = "user.logs"
group = "system"
title = "Logs older than a week"
paths = ["~/Library/Logs"]
min_age_days = 7
note = "Diagnostic logs and crash reports older than 7 days."

# --- trash ----------------------------------------------------------------------------

[[rule]]
id = "trash"
group = "trash"
title = "Empty the Trash"
paths = ["~/.Trash"]
default = false
note = "Everything in the Trash, permanently."

# --- privacy --------------------------------------------------------------------------
# History and cookies, one choice each, never preselected; skipped while the browser runs
# (it keeps these files open). Safari is missing on purpose: macOS keeps its data behind
# Full Disk Access (Library/Safari, Library/Cookies are private in guard.rs).

[[rule]]
id = "privacy.chrome.history"
group = "privacy"
title = "Chrome history"
paths = [
  "~/Library/Application Support/Google/Chrome/*/History",
  "~/Library/Application Support/Google/Chrome/*/History-journal",
  "~/Library/Application Support/Google/Chrome/*/History-wal",
]
target = "self"
running = ["com.google.Chrome"]
default = false
note = "Sites you visited and your download list. Bookmarks, passwords and open tabs stay."

[[rule]]
id = "privacy.chrome.cookies"
group = "privacy"
title = "Chrome cookies"
paths = [
  "~/Library/Application Support/Google/Chrome/*/Cookies",
  "~/Library/Application Support/Google/Chrome/*/Cookies-journal",
  "~/Library/Application Support/Google/Chrome/*/Network/Cookies",
  "~/Library/Application Support/Google/Chrome/*/Network/Cookies-journal",
]
target = "self"
running = ["com.google.Chrome"]
default = false
note = "Signs you out of every website and forgets site preferences kept in cookies. Saved passwords stay."

[[rule]]
id = "privacy.edge.history"
group = "privacy"
title = "Edge history"
paths = [
  "~/Library/Application Support/Microsoft Edge/*/History",
  "~/Library/Application Support/Microsoft Edge/*/History-journal",
  "~/Library/Application Support/Microsoft Edge/*/History-wal",
]
target = "self"
running = ["com.microsoft.edgemac"]
default = false
note = "Sites you visited and your download list. Bookmarks, passwords and open tabs stay."

[[rule]]
id = "privacy.edge.cookies"
group = "privacy"
title = "Edge cookies"
paths = [
  "~/Library/Application Support/Microsoft Edge/*/Cookies",
  "~/Library/Application Support/Microsoft Edge/*/Cookies-journal",
  "~/Library/Application Support/Microsoft Edge/*/Network/Cookies",
  "~/Library/Application Support/Microsoft Edge/*/Network/Cookies-journal",
]
target = "self"
running = ["com.microsoft.edgemac"]
default = false
note = "Signs you out of every website and forgets site preferences kept in cookies. Saved passwords stay."

[[rule]]
id = "privacy.brave.history"
group = "privacy"
title = "Brave history"
paths = [
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/History",
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/History-journal",
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/History-wal",
]
target = "self"
running = ["com.brave.Browser"]
default = false
note = "Sites you visited and your download list. Bookmarks, passwords and open tabs stay."

[[rule]]
id = "privacy.brave.cookies"
group = "privacy"
title = "Brave cookies"
paths = [
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/Cookies",
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/Cookies-journal",
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/Network/Cookies",
  "~/Library/Application Support/BraveSoftware/Brave-Browser/*/Network/Cookies-journal",
]
target = "self"
running = ["com.brave.Browser"]
default = false
note = "Signs you out of every website and forgets site preferences kept in cookies. Saved passwords stay."

[[rule]]
id = "privacy.arc.history"
group = "privacy"
title = "Arc history"
paths = [
  "~/Library/Application Support/Arc/User Data/*/History",
  "~/Library/Application Support/Arc/User Data/*/History-journal",
  "~/Library/Application Support/Arc/User Data/*/History-wal",
]
target = "self"
running = ["company.thebrowser.Browser"]
default = false
note = "Sites you visited and your download list. Bookmarks, passwords and open tabs stay."

[[rule]]
id = "privacy.arc.cookies"
group = "privacy"
title = "Arc cookies"
paths = [
  "~/Library/Application Support/Arc/User Data/*/Cookies",
  "~/Library/Application Support/Arc/User Data/*/Cookies-journal",
  "~/Library/Application Support/Arc/User Data/*/Network/Cookies",
  "~/Library/Application Support/Arc/User Data/*/Network/Cookies-journal",
]
target = "self"
running = ["company.thebrowser.Browser"]
default = false
note = "Signs you out of every website and forgets site preferences kept in cookies. Saved passwords stay."

[[rule]]
id = "privacy.firefox.history"
group = "privacy"
title = "Firefox history"
paths = [
  "~/Library/Application Support/Firefox/Profiles/*/places.sqlite",
  "~/Library/Application Support/Firefox/Profiles/*/places.sqlite-wal",
  "~/Library/Application Support/Firefox/Profiles/*/places.sqlite-shm",
]
target = "self"
running = ["org.mozilla.firefox"]
default = false
note = "Sites you visited. Firefox restores your bookmarks from its latest automatic backup; bookmarks changed since that backup may be lost."

[[rule]]
id = "privacy.firefox.cookies"
group = "privacy"
title = "Firefox cookies"
paths = [
  "~/Library/Application Support/Firefox/Profiles/*/cookies.sqlite",
  "~/Library/Application Support/Firefox/Profiles/*/cookies.sqlite-wal",
  "~/Library/Application Support/Firefox/Profiles/*/cookies.sqlite-shm",
]
target = "self"
running = ["org.mozilla.firefox"]
default = false
note = "Signs you out of every website and forgets site preferences kept in cookies. Saved passwords stay."
